const ACH=[['FIRST DIG','Break a block',s=>s.dug>=1],['DIGGER','250 blocks',s=>s.dug>=250],['EXCAVATOR','2000 blocks',s=>s.dug>=2000],['GOING DEEP','Reach 50m',s=>s.max>=50],['DEEPER','Reach 150m',s=>s.max>=150],['ABYSS','Reach 300m',s=>s.max>=300],['METALHEAD','200 metals',s=>(s.n.IRON|0)+(s.n.STEEL|0)+(s.n.COPPER|0)+(s.n.SCRAP|0)>=200],['UPGRADED','Buy an upgrade',s=>s.ups>0],['WELL EQUIPPED','Drill level 3',s=>s.drill>=3],['ARCHAEOLOGIST','Find a terminal',s=>s.terms>=1],['READER','Read 5 terminals',s=>s.terms>=5],['WHAT IS THIS?','Find an object',s=>s.eggs>=1],['COLLECTOR','Find 3 objects',s=>s.eggs>=3],['VARIETY','8 kinds of resource',s=>Object.keys(s.n).length>=8],['OLD CIVILIZATION','Reach the machine zone',s=>s.max>=235],['UNKNOWN','Hold unknown material',s=>(s.n['UNKNOWN MATERIAL']|0)>=1]];
// ---------- state / save ----------
const V=1,SK='ug_save',SB='ug_save_b';
let G;
function fresh(){return{v:V,seed:(Math.random()*1e9)|0,x:0,y:-1,inv:{},up:{drill:1,speed:1,move:1,light:1,luck:1},mods:[],terms:[],eggs:[],ach:[],dug:0,max:0,cfg:{mus:.6,sfx:.8,shake:1}}}
function load(){for(const k of[SK,SB]){try{const d=JSON.parse(localStorage.getItem(k));if(d&&d.v===V&&d.seed!=null)return Object.assign(fresh(),d)}catch(e){}}return fresh()}
function save(){try{G.x=px;G.y=py;G.mods=[...mods];G.exp=[...exp];const s=JSON.stringify(G);localStorage.setItem(SB,s);localStorage.setItem(SK,s)}catch(e){}}
G=load();let px=G.x,py=G.y;const mods=new Set(G.mods);
// ---------- world ----------
const H=(x,y,s)=>{let h=Math.imul(x,374761393)^Math.imul(y,668265263)^Math.imul(s,-1640531527);h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)};

const vn=(x,y,s)=>{const i=Math.floor(x),j=Math.floor(y),fx=x-i,fy=y-j,u=fx*fx*(3-2*fx),v=fy*fy*(3-2*fy),a=R(i,j,s),b=R(i+1,j,s),c=R(i,j+1,s),d=R(i+1,j+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v};
const biome=d=>{let i=0;for(let k=0;k<BIOMES.length;k++)if(d>=BIOMES[k][0])i=k;return i};
const mk=(x,y)=>y*400+x+200;
function gen(x,y){
 if(Math.abs(x)>=199)return 18;if(y<0)return 0;if(y===0)return 1;const s=G.seed,bi=biome(y);
 const cx=Math.floor(x/22),cy=Math.floor(y/22),h=H(cx,cy,s+7);
 if(y>14&&h%100<13){const rx=cx*22+4+(h>>>8)%14,ry=cy*22+4+(h>>>14)%14;
  if(Math.abs(x-rx)<=3&&Math.abs(y-ry)<=1)return(x===rx&&y===ry+1)?((h>>>20)%4===0?17:16):0}
 if(y>6&&vn(x*.11,y*.11,s)>.74)return 0;
 const r=R(x,y,s+1);
 if(r<.07){let t=0;const L=ORES.filter(o=>y>=o[1]&&y<=o[2]);for(const o of L)t+=o[3];let q=R(x,y,s+2)*t;for(const o of L){q-=o[3];if(q<=0)return o[0]}}
 const r2=R(x,y,s+3),v=vn(x*.07+50,y*.07,s);
 if(bi===3)return r2<.4?19:r2<.7?3:2;
 if(bi===2)return v>.55?2:r2<.1?3:1;
 if(bi===1)return r2<.2?3:v>.45?2:1;
 return(y>25&&r2<.1)?3:v>.58?2:1}
const CS=32,chunks=new Map();
function chunk(cx,cy){const k=cx+','+cy;let c=chunks.get(k);if(!c){c=new Uint8Array(1024);for(let j=0;j<32;j++)for(let i=0;i<32;i++){const x=cx*32+i,y=cy*32+j;c[j*32+i]=mods.has(mk(x,y))?0:gen(x,y)}chunks.set(k,c)}return c}
const tile=(x,y)=>{if(x<-199||x>199)return 18;if(y<0)return 0;return chunk(x>>5,y>>5)[(y&31)*32+(x&31)]};
const setTile=(x,y,v)=>{chunk(x>>5,y>>5)[(y&31)*32+(x&31)]=v;mods.add(mk(x,y))};
function unload(){const pc=px>>5,pr=py>>5;for(const k of chunks.keys()){const[a,b]=k.split(',').map(Number);if(Math.abs(a-pc)>3||Math.abs(b-pr)>3)chunks.delete(k)}}
// ---------- audio ----------
let A=null,mg,sg,droneF;
function audio(){if(A)return;try{A=new(window.AudioContext||window.webkitAudioContext)()}catch(e){return}
 mg=A.createGain();sg=A.createGain();mg.connect(A.destination);sg.connect(A.destination);vol();
 droneF=A.createBiquadFilter();droneF.type='lowpass';droneF.frequency.value=180;droneF.connect(mg);
 [[41,'sawtooth',.05],[41.6,'sawtooth',.05],[82.2,'sine',.04]].forEach(([f,t,g])=>{const o=A.createOscillator(),n=A.createGain();o.type=t;o.frequency.value=f;n.gain.value=g;o.connect(n);n.connect(droneF);o.start()});
 const l=A.createOscillator(),lg=A.createGain();l.frequency.value=.07;lg.gain.value=60;l.connect(lg);lg.connect(droneF.frequency);l.start();
 const nb=A.createBuffer(1,A.sampleRate*2,A.sampleRate),d=nb.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NB=nb;

 amb();pad()}
let NB;const vol=()=>{if(!A)return;mg.gain.value=G.cfg.mus*.9;sg.gain.value=G.cfg.sfx}

function amb(){if(!A)return;const t=A.currentTime,r=Math.random();
 if(r<.4)tone(1500+Math.random()*900,t,.25,.05,'sine',mg);else if(r<.7)tone(70+Math.random()*30,t,1.4,.09,'triangle',mg);else tone(110,t,.9,.025,'square',mg);
 setTimeout(amb,2500+Math.random()*6000)}
function pad(){if(!A)return;const t=A.currentTime,bi=biome(Math.max(0,py)),root=[55,49,58.3,43.7][bi],ch=[1,1.189,1.498,1.782];
 for(let i=0;i<3;i++)tone(root*ch[(Math.random()*4)|0]*(i?2:1),t+i*.8,7,.05,'sine',mg);setTimeout(pad,9000)}

 const P={d:['lowpass',500,.18],s:['bandpass',900,.2],c:['lowpass',700,.28],m:['bandpass',2000,.18],x:['highpass',3000,.14]}[k]||['lowpass',500,.15];
 f.type=P[0];f.frequency.value=P[1];g.gain.setValueAtTime(P[2]*(big?1.4:1),t);g.gain.exponentialRampToValueAtTime(.001,t+.16);s.connect(f);f.connect(g);g.connect(sg);s.start(t,Math.random(),.2);

// ---------- game ----------
const cv=document.getElementById('c'),cx=cv.getContext('2d');let W,Hh,T,dpr;

const inv=(n)=>G.inv[n]|0;
function stats(){return{dug:G.dug,max:G.max,n:G.inv,ups:Object.values(G.up).reduce((a,b)=>a+b-1,0),drill:G.up.drill,terms:G.terms.length,eggs:G.eggs.length}}
function checkAch(){const s=stats();for(const a of ACH)if(!G.ach.includes(a[0])&&a[2](s)){G.ach.push(a[0]);setTimeout(()=>say('achievement: '+a[0].toLowerCase()),600);blip(520)}}
function give(n,q){G.inv[n]=(G.inv[n]|0)+q;floats.push({x:tgt?tgt[0]:px,y:tgt?tgt[1]:py,t:1,s:'+'+q+' '+n})}

function destroy(x,y){const t=tile(x,y),b=B[t];setTile(x,y,0);G.dug++;burst(x,y,b[1],10);sfx(b[5],b[2]>4);shake=Math.max(shake,b[2]>4?.5:.15);
 if(b[4]){let q=1;if(Math.random()<(G.up.luck-1)*.12)q++;give(b[4],q)}
 if(t===16){const i=H(x,y,G.seed)%STORY.length;if(!G.terms.includes(i))G.terms.push(i);say(STORY[i]);shake=Math.max(shake,1);blip(330)}

function update(dt){
 let ax=held.R-held.L,ay=held.D-held.U;if(G.controlMode==='joystick'){ax=jx;ay=jy}else if(ax)ay=0;
 const mag=Math.min(1,Math.hypot(ax,ay)),sp=(2.6+G.up.move*.6)*mag;let drilling=false;
 if(mag>.01){const ux=ax/mag,uy=ay/mag,st=Math.min(.25,sp*dt),nx=ux*st,ny=uy*st;face=Math.abs(ax)>=Math.abs(ay)?[Math.sign(ax),0]:[0,Math.sign(ay)];
  const pr=(x,y,sx,sy)=>{let b=null;for(const o of[0,-.3,.3]){const tx=Math.round(x+(sx?sx*.49:o)),ty=Math.round(y+(sy?sy*.49:o));if(tile(tx,ty)!==0&&(!b||o===0))b=[tx,ty]}return b};
  let bx=null,by=null;

  if(Math.abs(ny)>1e-4){by=pr(px,py+ny,0,Math.sign(ny));if(!by)py=Math.max(-1,py+ny)}

   if(!tgt||tgt[0]!==bl[0]||tgt[1]!==bl[1]){tgt=bl;prog=0}

   if(b[3]>G.up.drill){if(performance.now()>weakT){say(t===18?'solid bedrock':'drill too weak');weakT=performance.now()+4000}}
   else{drilling=true;prog+=dt/(b[2]*.42/(1+.22*(G.up.speed-1))/(1+.1*(G.up.drill-1)));if(Math.random()<dt*14)burst(tgt[0]-ux*.4,tgt[1]-uy*.4,b[1],1);if(Math.random()<dt*8&&parts.length<130)parts.push({x:px+(Math.random()-.5)*.6,y:py+.3,vx:Math.random()-.5,vy:-.4,l:.8,c:'#8a7f70',s:.12,g:-.3});
    if(prog>=1){destroy(tgt[0],tgt[1]);tgt=null;prog=0}}}
